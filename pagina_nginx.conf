# FiscalOS - pagina de intrebari. PENTRU ADMINISTRATOR (cere sudo; FiscalOS nu are si nu cere drepturi de root).
# Separata de iConta: alt nume de domeniu, alt port intern (8030), niciun fisier comun cu iConta.
#
# 1. DNS: inregistrare A  fiscalos.iconta.eu -> 178.105.201.56   (azi NU exista; verificat cu getent)
# 2. sudo cp pagina_nginx.conf /etc/nginx/sites-available/fiscalos
#    sudo ln -s /etc/nginx/sites-available/fiscalos /etc/nginx/sites-enabled/fiscalos
#    sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d fiscalos.iconta.eu      (adauga blocul 443 si redirectarea 80 -> 443)
# Dupa pasul 3, pagina e la https://fiscalos.iconta.eu ; parola paginii ramane singura cheie de acces.
server {
    listen 80;
    listen [::]:80;
    server_name fiscalos.iconta.eu;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # suprascris aici: limita de incercari pe IP real
        proxy_set_header X-Forwarded-Proto $scheme;       # cookie-ul primeste Secure sub https
        proxy_read_timeout 120s;
    }
}
